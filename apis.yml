name: Altira Health
description: 'Altira Health is a San Francisco-based healthcare technology company, founded in 2025,
  building AI-powered clinical follow-up for health systems. Its virtual clinical assistant, Lena,
  engages discharged and at-risk patients over voice and SMS, carries clinical context from the EMR
  across interactions, adapts across languages, escalates to human clinicians when needed, and documents
  findings directly back into the electronic medical record. The platform aims to recover clinician
  staff time and reduce hospital readmissions, and advertises API, webhook, dashboard, and analytics
  surfaces for connected EMR workflows (no public developer portal or API documentation is published as
  of this profile). Backed by Homebrew, Coalition, Focal, Stone Mountain Ventures, and Wireframe Ventures.'
